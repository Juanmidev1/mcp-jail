[package]
name = "mcp-jail"
version = "0.1.0"
edition = "2024"
description = "Rootless Linux kernel sandbox and syscall auditor for MCP servers"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
